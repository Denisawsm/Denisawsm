name: Generate snake animation

on:
  # Run every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Adds a "Run workflow" button in the Actions tab
  workflow_dispatch:
  # Also run when you push to main, handy while testing
  push:
    branches:
      - main

# The job needs permission to push the generated files to a branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Step A: generate the images
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step B: publish the dist/ folder to a branch called "output"
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
